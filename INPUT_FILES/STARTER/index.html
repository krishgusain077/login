<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Harborline Workspace | Account access</title><link rel="icon" href="../BRAND_ASSETS/harborline_logo.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><script src="./app.js" defer></script></head>
<body><a class="skip-link" href="#main">Skip to account form</a><header class="site-header"><span class="wordmark">Harborline <span>Workspace</span></span></header>
<main id="main" class="auth-layout"><aside class="brand-panel" aria-label="Harborline overview"><h1>Your work, in one calm place.</h1><p>A clear space for projects, files and ideas.</p><img src="../BRAND_ASSETS/workspace_art.png" alt="Illustration of a workspace dashboard with a check mark" width="680" height="560"></aside>
<section class="form-panel" aria-labelledby="form-title"><div class="mode-switch" role="group" aria-label="Choose account form"><button type="button" id="login-tab" aria-pressed="true">Sign in</button><button type="button" id="register-tab" aria-pressed="false">Register</button></div><h2 id="form-title">Welcome back</h2><p id="form-description">Sign in to continue to your workspace.</p>
<form id="account-form" novalidate method="post" autocomplete="on"><div id="name-row" class="field" hidden><label for="full-name">Full name</label><input id="full-name" name="fullName" autocomplete="name"></div>
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><p class="field-error" id="email-error"></p></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><p class="field-error" id="password-error"></p></div>
<div id="confirmation-row" class="field" hidden><label for="confirmation">Confirm password</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password"></div>
<div id="consent-row" class="consent" hidden><input id="consent" type="checkbox" name="consent"><label for="consent">I agree to the <a href="./terms.html">Terms</a> and <a href="./privacy.html">Privacy Policy</a>.</label></div>
<div id="form-status" role="status" aria-live="polite"></div><button type="submit" class="primary-btn">Sign in</button></form></section></main>
<footer>© 2026 Harborline Workspace · Account interface</footer></body></html>
