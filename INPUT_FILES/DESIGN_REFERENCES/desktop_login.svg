, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start">Email address</text><rect x="810" y="273" width="478" height="56" rx="10" fill="white" stroke="#CADDDD" stroke-width="1.5"/><text x="826" y="306" fill="#80939E" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start">name@example.com</text><text x="810" y="362" fill="#19394B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start">Password</text><rect x="810" y="373" width="478" height="56" rx="10" fill="white" stroke="#CADDDD" stroke-width="1.5"/><text x="826" y="406" fill="#80939E" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Enter your password</text><rect x="810" y="462" width="478" height="53" rx="11" fill="#087F8C"/><text x="1049.0" y="496" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Sign in</text><text x="1049.0" y="556" fill="#087F8C" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">New here? Create an account</text><text x="1049.0" y="871" fill="#637887" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Harborline Workspace · Account interface</text></svg>